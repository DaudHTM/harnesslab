[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "harnesslab"
version = "0.1.0"
description = "Reproducible evaluation and fault injection for coding agents"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "typer>=0.12,<1", "pydantic>=2.10,<3", "mcp>=2.3,<3", "psycopg[binary]>=3.2,<4", "httpx>=0.28,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
harnesslab = "harnesslab.cli:app"

[tool.setuptools.packages.find]
include = ["harnesslab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
