services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: harnesslab
      POSTGRES_USER: harnesslab
      POSTGRES_PASSWORD: local-development-only
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U harnesslab"]
      interval: 3s
      timeout: 3s
      retries: 20
  bootstrap:
    build: .
    command: ["python", "scripts/bootstrap_all.py"]
    volumes:
      - state:/app/.harnesslab
      - tasks:/app/benchmarks/tasks
  api:
    build: .
    ports:
      - "127.0.0.1:${HARNESSLAB_HTTP_PORT:-8000}:8000"
    environment:
      HARNESSLAB_DATABASE_URL: postgresql://harnesslab:local-development-only@postgres:5432/harnesslab
    volumes:
      - state:/app/.harnesslab
      - tasks:/app/benchmarks/tasks
    depends_on:
      postgres:
        condition: service_healthy
      bootstrap:
        condition: service_completed_successfully
  worker:
    build: .
    command: ["harnesslab", "worker"]
    environment:
      HARNESSLAB_DATABASE_URL: postgresql://harnesslab:local-development-only@postgres:5432/harnesslab
    volumes:
      - state:/app/.harnesslab
      - tasks:/app/benchmarks/tasks
      # Only this trusted control-plane worker receives the Docker socket.
      # Child task containers receive no socket or host mounts.
      - ${HARNESSLAB_DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy
      bootstrap:
        condition: service_completed_successfully
volumes:
  postgres-data:
  state:
  tasks:
