name: checks
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q
      - run: docker build -f docker/task.Dockerfile -t harnesslab-task:local .
      - run: HARNESSLAB_TEST_DOCKER=1 python -m pytest tests/test_docker.py -q
      - run: python scripts/bootstrap_demo.py
      - run: harnesslab tasks validate benchmarks/tasks/tag-normalization.json
      - run: harnesslab run benchmarks/tasks/tag-normalization.json
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: '11'
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: harnesslab_test
          POSTGRES_USER: harnesslab
          POSTGRES_PASSWORD: test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U harnesslab -d harnesslab_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      HARNESSLAB_TEST_POSTGRES_URL: postgresql://harnesslab:test-only@127.0.0.1:5432/harnesslab_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest tests/test_postgres.py -q
